services:
  db:
    image: postgres:16-alpine
    container_name: jobcard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - jobcard_pgdata:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend        
    container_name: jobcard_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Job-card  
    container_name: jobcard_frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    volumes:
      - ./Job-card:/app
      - /app/node_modules

volumes:
  jobcard_pgdata: